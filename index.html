<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Master - Leaderboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .leaderboard-card { background: #1e1e1e; padding: 30px; border-radius: 20px; max-width: 600px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #00ffcc; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; border-bottom: 1px solid #333; text-align: left; }
        th { color: #ffcc00; font-size: 1.2rem; }
        .rank { color: #00ffcc; font-weight: bold; }
        button { background: #00ffcc; color: black; border: none; padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        #loading { color: #888; margin-top: 20px; }
    </style>
</head>
<body>

<div class="leaderboard-card">
    <h1>Global Leaderboard</h1>
    <p>Top Typing Masters</p>

    <div id="loading">Fetching scores...</div>
    
    <table id="leaderboard-table" style="display: none;">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>WPM</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            </tbody>
    </table>

    <button onclick="location.href='index.html'">Play Again</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // Apka Firebase Config (Same as index.html)
    const firebaseConfig = {
        apiKey: "AIzaSyBCluuEOdQT8qRyNJ-o0WVc1dvrOpx9wzI",
        authDomain: "fast-your-typing-speed.firebaseapp.com",
        databaseURL: "https://fast-your-typing-speed-default-rtdb.firebaseio.com",
        projectId: "fast-your-typing-speed",
        storageBucket: "fast-your-typing-speed.firebasestorage.app",
        messagingSenderId: "672179630598",
        appId: "1:672179630598:web:0e034fae6f2174ef2f8987"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const leaderboardBody = document.getElementById('leaderboard-body');
    const loadingText = document.getElementById('loading');
    const table = document.getElementById('leaderboard-table');

    // Firebase se data lane ka function
    database.ref('leaderboard').orderByChild('score').limitToLast(10).once('value', (snapshot) => {
        let scores = [];
        snapshot.forEach((childSnapshot) => {
            scores.push(childSnapshot.val());
        });

        // Scores ko descending order (zyada se kam) mein sort karna
        scores.reverse();

        loadingText.style.display = 'none';
        table.style.display = 'table';

        if (scores.length === 0) {
            leaderboardBody.innerHTML = "<tr><td colspan='3'>No scores yet. Be the first!</td></tr>";
        } else {
            scores.forEach((data, index) => {
                let row = `
                    <tr>
                        <td class="rank">#${index + 1}</td>
                        <td>${data.name}</td>
                        <td style="color: #44ff44; font-weight: bold;">${data.score}</td>
                    </tr>
                `;
                leaderboardBody.innerHTML += row;
            });
        }
    });
</script>

</body>
</html>

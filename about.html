<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; }
        .container { margin-top: 50px; }
        table { margin: 20px auto; border-collapse: collapse; width: 80%; max-width: 400px; }
        th, td { border: 1px solid #444; padding: 12px; text-align: center; }
        th { background: #00ffcc; color: black; }
        button { padding: 10px 20px; background: #ffcc00; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Leaderboard</h1>
        <table id="leaderboardTable">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>WPM</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                </tbody>
        </table>
        <br>
        <button onclick="location.href='index.html'">Back to Game</button>
        <button onclick="clearScores()" style="background:red; color:white; margin-left:10px;">Reset Scores</button>
    </div>

    <script>
        window.onload = function() {
            let leaderboard = JSON.parse(localStorage.getItem('leaderboard')) || [];
            let tableBody = document.getElementById('leaderboardBody');

            if (leaderboard.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='3'>No scores yet! Play the game first.</td></tr>";
            } else {
                leaderboard.forEach((entry, index) => {
                    let row = `<tr>
                        <td>${index + 1}</td>
                        <td>${entry.name}</td>
                        <td>${entry.score}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            }
        };

        function clearScores() {
            if(confirm("Are you sure you want to reset leaderboard?")) {
                localStorage.removeItem('leaderboard');
                location.reload();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; display: inline-block; min-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #333; }
        h1 { color: #ffcc00; margin-bottom: 20px; font-size: 28px; }
        table { width: 100%; margin-top: 10px; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid #2a2a2a; }
        th { color: #00ffcc; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
        td { font-size: 18px; }
        .btn-container { margin-top: 30px; }
        .btn { 
            display: inline-block; 
            padding: 12px 30px; 
            background: #00ffcc; 
            color: #000; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }
        .btn:hover { background: #00cca3; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0, 255, 204, 0.4); }
    </style>
</head>
<body>

    <div class="box">
        <h1>🏆 Leaderboard</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>WPM</th>
                </tr>
            </thead>
            <tbody id="list">
                </tbody>
        </table>

        <div class="btn-container">
            <a href="index.html" class="btn">🔄 Play Again</a>
        </div>
    </div>

    <script>
        // Data load karne ka function
        function loadLeaderboard() {
            const list = document.getElementById('list');
            const rawData = localStorage.getItem('leaderboard');
            let scores = [];

            try {
                scores = rawData ? JSON.parse(rawData) : [];
            } catch (e) {
                console.error("Error parsing leaderboard data", e);
                scores = [];
            }

            if (scores.length === 0) {
                list.innerHTML = "<tr><td colspan='3' style='padding:30px; color:#666;'>No scores available yet!</td></tr>";
            } else {
                // Sorting: Zyada WPM upar ayega
                scores.sort((a, b) => b.score - a.score);

                // Sirf Top 10 dikhane ke liye
                const topScores = scores.slice(0, 10);

                list.innerHTML = ""; // List clear karke fresh data dalna
                topScores.forEach((s, i) => {
                    const row = `<tr>
                        <td style="color: #ffcc00; font-weight: bold;">#${i + 1}</td>
                        <td>${s.name || 'Anonymous'}</td>
                        <td style="color: #00ffcc; font-weight: bold;">${s.score || 0}</td>
                    </tr>`;
                    list.innerHTML += row;
                });
            }
        }

        // Page load hote hi function chalao
        loadLeaderboard();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; display: inline-block; min-width: 300px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        h1 { color: #ffcc00; }
        table { width: 100%; margin-top: 20px; border-spacing: 0; }
        th, td { padding: 15px; border-bottom: 1px solid #333; }
        th { color: #00ffcc; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #00ffcc; color: black; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🏆 Leaderboard</h1>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>WPM</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
        <a href="index.html" class="btn">Play Again</a>
        <button onclick="localStorage.clear(); location.reload();" style="background: #ff4444; border:none; padding:10px; color:white; border-radius:5px; cursor:pointer; margin-left:10px;">Reset All</button>
    </div>

    <script>
        const scores = JSON.parse(localStorage.getItem('leaderboard')) || [];
        const list = document.getElementById('list');
        if (scores.length === 0) {
            list.innerHTML = "<tr><td colspan='3'>No scores yet!</td></tr>";
        } else {
            scores.forEach((s, i) => {
                list.innerHTML += `<tr><td>${i+1}</td><td>${s.name}</td><td>${s.score}</td></tr>`;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Leaderboard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; display: inline-block; min-width: 350px; border: 1px solid #333; }
        h1 { color: #ffcc00; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid #2a2a2a; }
        th { color: #00ffcc; text-transform: uppercase; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #00ffcc; color: black; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h1>🏆 Global Leaderboard</h1>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>WPM</th>
                </tr>
            </thead>
            <tbody id="list">
                <tr><td colspan="3">Loading scores...</td></tr>
            </tbody>
        </table>
        <a href="index.html" class="btn">🔄 Play Again</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBCluuEOdQT8qRyNJ-o0WVc1dvrOpx9wzI",
            authDomain: "fast-your-typing-speed.firebaseapp.com",
            databaseURL: "https://fast-your-typing-speed-default-rtdb.firebaseio.com",
            projectId: "fast-your-typing-speed",
            storageBucket: "fast-your-typing-speed.firebasestorage.app",
            messagingSenderId: "672179630598",
            appId: "1:672179630598:web:0e034fae6f2174ef2f8987"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        database.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', (snapshot) => {
            const list = document.getElementById('list');
            list.innerHTML = "";
            let scores = [];

            snapshot.forEach((childSnapshot) => {
                scores.push(childSnapshot.val());
            });

            scores.reverse().forEach((s, i) => {
                list.innerHTML += `
                    <tr>
                        <td style="color: #ffcc00; font-weight: bold;">#${i + 1}</td>
                        <td>${s.name}</td>
                        <td style="color: #00ffcc; font-weight: bold;">${s.score}</td>
                    </tr>`;
            });
            if(scores.length === 0) list.innerHTML = "<tr><td colspan='3'>No scores yet!</td></tr>";
        });
    </script>
</body>
</html>
